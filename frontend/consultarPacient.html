<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
    <title>Consulta de Pacient</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 450px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; }
        .search-group { display: flex; gap: 10px; margin-bottom: 25px; }
        input { flex: 1; padding: 12px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 15px; }
        input:focus { border-color: #1abc9c; outline: none; }
        button { padding: 12px 20px; background-color: #1abc9c; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #16a085; }
        .result-box { display: none; background: #fafafa; border: 1px solid #e4e7ed; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .result-box p { margin: 10px 0; font-size: 15px; color: #555; border-bottom: 1px dashed #eee; padding-bottom: 8px; }
        .result-box strong { color: #2c3e50; float: right; }
    </style>
</head>
<body>

<div class="card">
    <h2>Consultar Fitxa Pacient</h2>
    
    <div class="search-group">
        <input type="text" id="cerca_dni" placeholder="Introdueix el DNI del pacient">
        <button type="button" id="btnCercar">Cercar</button>
    </div>

    <div class="result-box" id="resultats">
        <p>Nom Complet: <strong id="res_nom">-</strong></p>
        <p>DNI / Identificador: <strong id="res_dni">-</strong></p>
        <p>Data Naixement: <strong id="res_data">-</strong></p>
        <p>Telèfon Contacte: <strong id="res_tel">-</strong></p>
        <p>Correu Electrònic: <strong id="res_correu">-</strong></p>
        <p>Adreça Postal: <strong id="res_adreca">-</strong></p>
    </div>
</div>

<script>
document.getElementById('btnCercar').addEventListener('click', async () => {
    const dni = document.getElementById('cerca_dni').value.trim();
    const resBox = document.getElementById('resultats');
    
    if (!dni) {
        alert("Si us plau, introdueix un DNI vàlid.");
        return;
    }

    try {
        const resposta = await fetch(`http://127.0.0.1:8000/pacients/?dni=${dni}`);
        const data = await resposta.json();

        if (resposta.status === 200) {
            document.getElementById('res_nom').textContent = `${data.pacient.cognoms}, ${data.pacient.nom}`;
            document.getElementById('res_dni').textContent = data.pacient.dni;
            document.getElementById('res_data').textContent = data.pacient.data_naixement || 'No informada';
            document.getElementById('res_tel').textContent = data.pacient.telefon;
            document.getElementById('res_correu').textContent = data.pacient.correu;
            document.getElementById('res_adreca').textContent = data.pacient.adreca;
            
            resBox.style.display = 'block';
        } else {
            resBox.style.display = 'none';
            alert("❌ " + data.missatge);
        }
    } catch (err) {
        alert("❌ Error de connexió amb el servidor.");
    }
});
</script>
</body>
</html>
