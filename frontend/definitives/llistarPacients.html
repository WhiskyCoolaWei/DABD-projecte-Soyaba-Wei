<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Cens i Control de Pacients</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 95%; max-width: 1000px; }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; margin-bottom: 25px; }
        .filter-box { display: flex; gap: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 25px; align-items: flex-end; border: 1px solid #e4e7ed; }
        .input-group { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; }
        input { padding: 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; }
        button { padding: 11px 20px; background-color: #1abc9c; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #16a085; }
        .btn-clear { background-color: #909399; }
        .btn-clear:hover { background-color: #73767a; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #f8f9fa; color: #2c3e50; font-weight: 600; cursor: pointer; user-select: none; }
        th:hover { background-color: #eef2f5; color: #1abc9c; }
        .badge-citas { background-color: #e8f8f5; color: #16a085; padding: 4px 10px; border-radius: 12px; font-weight: bold; display: inline-block; }
        .badge-zero { background-color: #fef0f0; color: #f56c6c; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 25px; }
        .pagination button { background-color: #fff; color: #1abc9c; border: 1px solid #1abc9c; padding: 6px 14px; }
        .pagination button:disabled { color: #c0c4cc; border-color: #e4e7ed; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cens de Pacients i Citas Actives</h2>
    
    <div class="filter-box">
        <div class="input-group">
            <label>Filtrar DNI</label>
            <input type="text" id="f_dni" placeholder="Ex: 12345678X">
        </div>
        <div class="input-group">
            <label>Filtrar Nom</label>
            <input type="text" id="f_nom" placeholder="Ex: Marta">
        </div>
        <div class="input-group">
            <label>Filtrar Cognoms</label>
            <input type="text" id="f_cognoms" placeholder="Ex: Roca">
        </div>
        <button id="btnFiltrar">Cercar</button>
        <button class="btn-clear" id="btnNetejar">Netejar</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>DNI</th>
                <th>Pacient (Cognoms, Nom)</th>
                <th>Telèfon</th>
                <th>Correu Electrònic</th>
                <th id="th_citas" style="background-color: #eefaf6; color: #16a085;">Citas Actives ↕</th>
            </tr>
        </thead>
        <tbody id="taula_pacients">
            </tbody>
    </table>

    <div class="pagination">
        <button id="btnPrev" disabled>Anterior</button>
        <span id="infoPagina">Pàgina 1 de 1</span>
        <button id="btnNext" disabled>Següent</button>
    </div>
</div>

<script>
let paginaActual = 1;
let ordreCitas = ''; // Cambiará entre: '', 'citas_activas', '-citas_activas'

async function carregarPacients() {
    const tbody = document.getElementById('taula_pacients');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Carregant dades...</td></tr>';
    
    const dni = document.getElementById('f_dni').value.trim();
    const nom = document.getElementById('f_nom').value.trim();
    const cognoms = document.getElementById('f_cognoms').value.trim();
    
    try {
        const params = new URLSearchParams();
        params.append('pagina', paginaActual);
        if (dni) params.append('dni', dni);
        if (nom) params.append('nom', nom);
        if (cognoms) params.append('cognoms', cognoms);
        if (ordreCitas) params.append('ordenar_per', ordreCitas);

        const resposta = await fetch(`http://127.0.0.1:8000/pacients/?${params.toString()}`);
        const dada = await resposta.json();
        
        tbody.innerHTML = '';

        if (dada.status === "èxit" && dada.pacients.length > 0) {
            dada.pacients.forEach(p => {
                const badgeClass = p.citas_activas === 0 ? 'badge-citas badge-zero' : 'badge-citas';
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td><strong>${p.dni}</strong></td>
                    <td>${p.cognoms}, ${p.nom}</td>
                    <td>${p.telefon}</td>
                    <td>${p.correu}</td>
                    <td><span class="${badgeClass}">${p.citas_activas} actives</span></td>
                `;
                tbody.appendChild(fila);
            });
            
            document.getElementById('infoPagina').textContent = `Pàgina ${dada.paginacio.pagina_actual} de ${dada.paginacio.total_pagines}`;
            document.getElementById('btnPrev').disabled = !dada.paginacio.te_anterior;
            document.getElementById('btnNext').disabled = !dada.paginacio.te_seguent;
        } else {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#909399;">No s\'han trobat pacients.</td></tr>';
        }
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">❌ Error al connectar amb el servidor.</td></tr>';
    }
}

// Lógica para alternar el orden de citas activas al hacer clic en la cabecera
document.getElementById('th_citas').addEventListener('click', () => {
    if (ordreCitas === '') {
        ordreCitas = 'citas_activas'; // Menos citas primero (Ascendente)
        document.getElementById('th_citas').textContent = 'Citas Actives ⬆';
    } else if (ordreCitas === 'citas_activas') {
        ordreCitas = '-citas_activas'; // Más citas primero (Descendente)
        document.getElementById('th_citas').textContent = 'Citas Actives ⬇';
    } else {
        ordreCitas = ''; // Quitar orden especial
        document.getElementById('th_citas').textContent = 'Citas Actives ↕';
    }
    paginaActual = 1;
    carregarPacients();
});

document.getElementById('btnFiltrar').addEventListener('click', () => { paginaActual = 1; carregarPacients(); });
document.getElementById('btnNetejar').addEventListener('click', () => {
    document.getElementById('f_dni').value = '';
    document.getElementById('f_nom').value = '';
    document.getElementById('f_cognoms').value = '';
    ordreCitas = '';
    document.getElementById('th_citas').textContent = 'Citas Actives ↕';
    paginaActual = 1;
    carregarPacients();
});

document.getElementById('btnPrev').addEventListener('click', () => { if (paginaActual > 1) { paginaActual--; carregarPacients(); } });
document.getElementById('btnNext').addEventListener('click', () => { paginaActual++; carregarPacients(); });

window.onload = () => carregarPacients();
</script>
</body>
</html>
