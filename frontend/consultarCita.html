<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
    <title>Consulta de Cites</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; padding: 40px; }
        .search-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 450px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; }
        .search-group { display: flex; gap: 10px; margin-bottom: 25px; }
        input { flex: 1; padding: 12px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 15px; }
        input:focus { border-color: #3498db; outline: none; }
        button { padding: 12px 20px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        .result-box { display: none; background: #fafafa; border: 1px solid #e4e7ed; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .result-box p { margin: 10px 0; font-size: 15px; color: #555; border-bottom: 1px dashed #eee; padding-bottom: 8px; }
        .result-box strong { color: #2c3e50; float: right; }
        .badge { background: #e6a23c; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="search-card">
    <h2>Consultar Estat de la Cita</h2>
    
    <div class="search-group">
        <input type="text" id="input_codi" placeholder="Introdueix el codi (Ex: CT12345678)">
        <button type="button" id="btnCerca">Cercar</button>
    </div>

    <div class="result-box" id="resultats">
        <p>Codi de la cita: <strong id="res_codi">-</strong></p>
        <p>Data: <strong id="res_data">-</strong></p>
        <p>Hora: <strong id="res_hora">-</strong></p>
        <p>Estat actual: <strong><span class="badge" id="res_estat">-</span></strong></p>
        <p>Metge (DNI): <strong id="res_metge">-</strong></p>
        <p>Pacient (DNI): <strong id="res_pacient">-</strong></p>
        <p>Centre: <strong id="res_centre">-</strong></p>
        <p>Sala: <strong id="res_sala">-</strong></p>
    </div>
</div>

<script>
document.getElementById('btnCerca').addEventListener('click', async () => {
    const codi = document.getElementById('input_codi').value.trim();
    const resultBox = document.getElementById('resultats');
    
    if (!codi) {
        alert("Si us plau, introdueix un codi de cita vàlid.");
        return;
    }

    try {
        const resposta = await fetch(`http://127.0.0.1:8000/cites/?codi_cita=${codi}`);
        const dada = await resposta.json();

        if (resposta.status === 200) {
            document.getElementById('res_codi').textContent = dada.cita.codi_cita;
            document.getElementById('res_data').textContent = dada.cita.data;
            document.getElementById('res_hora').textContent = dada.cita.hora;
            document.getElementById('res_estat').textContent = dada.cita.estat.toUpperCase();
            document.getElementById('res_metge').textContent = dada.cita.dni_metge;
            document.getElementById('res_pacient').textContent = dada.cita.dni_pacient;
            document.getElementById('res_centre').textContent = dada.cita.codi_centre;
            document.getElementById('res_sala').textContent = dada.cita.codi_sala;
            
            resultBox.style.display = 'block';
        } else {
            resultBox.style.display = 'none';
            alert("❌ Error: " + dada.missatge);
        }
    } catch (e) {
        alert("Error de connexió amb el servidor.");
    }
});
</script>

</body>
</html>
