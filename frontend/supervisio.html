<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>HealthLog – Supervisió</title>
</head>
<body>
  <h1>HealthLog – Supervisió de metges</h1>

  <h2>Veure supervisats d'un metge</h2>
  <input type="text" id="dni_supervisor" placeholder="DNI del supervisor...">
  <button onclick="veureSupervisats()">Veure supervisats</button>
  <ul id="llistaSupervisats"></ul>

  <h2>Veure supervisors d'un metge</h2>
  <input type="text" id="dni_supervisat" placeholder="DNI del supervisat...">
  <button onclick="veureSupervisors()">Veure supervisors</button>
  <ul id="llistaSupervisors"></ul>

  <hr>
  <h2>Crear nova supervisió</h2>
  <form id="supervisioForm">
    <label>DNI supervisor:<br><input type="text" id="dni_sup" required></label><br><br>
    <label>DNI supervisat:<br><input type="text" id="dni_supt" required></label><br><br>
    <button type="submit">Crear supervisió</button>
  </form>
  <p id="msgSupervisio"></p>

  <script>
    const API = 'http://localhost:8000';

    async function veureSupervisats() {
      const dni = document.getElementById('dni_supervisor').value;
      const res  = await fetch(`${API}/supervisio/?dni_supervisor=${dni}`);
      const data = await res.json();
      const ul   = document.getElementById('llistaSupervisats');
      if (data.status === 'èxit') {
        ul.innerHTML = data.supervisats.length
          ? data.supervisats.map(m =>
              `<li><strong>${m.dni}</strong> – ${m.nom} ${m.cognoms}</li>`
            ).join('')
          : '<li>Aquest metge no supervisa ningú.</li>';
      } else {
        ul.innerHTML = `<li style="color:red">${data.missatge}</li>`;
      }
    }

    async function veureSupervisors() {
      const dni = document.getElementById('dni_supervisat').value;
      const res  = await fetch(`${API}/supervisio/?dni_supervisat=${dni}`);
      const data = await res.json();
      const ul   = document.getElementById('llistaSupervisors');
      if (data.status === 'èxit') {
        ul.innerHTML = data.supervisors.length
          ? data.supervisors.map(m =>
              `<li><strong>${m.dni}</strong> – ${m.nom} ${m.cognoms}</li>`
            ).join('')
          : '<li>Aquest metge no té supervisors.</li>';
      } else {
        ul.innerHTML = `<li style="color:red">${data.missatge}</li>`;
      }
    }

    document.getElementById('supervisioForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch(`${API}/supervisio/`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          dni_supervisor: document.getElementById('dni_sup').value,
          dni_supervisat: document.getElementById('dni_supt').value
        })
      });
      const data = await res.json();
      const msg  = document.getElementById('msgSupervisio');
      msg.style.color = data.status === 'èxit' ? 'green' : 'red';
      msg.textContent = data.missatge;
    });
  </script>
</body>
</html>
