<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
    <title>HealthLog - Gestio Clinica</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px 25px; border-radius: 8px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .card.blau  { border-left: 5px solid #1a5276; }
        .card.verd  { border-left: 5px solid #28a745; }
        .card.taronja { border-left: 5px solid #e67e22; }
        .card.lila  { border-left: 5px solid #8e44ad; }
        h1 { color: #1a5276; margin-bottom: 5px; }
        h2 { color: #1a5276; margin-top: 0; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        label { display: block; margin: 8px 0 3px; font-weight: bold; color: #555; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 7px; box-sizing: border-box;
                                   border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        textarea { height: 55px; resize: vertical; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        button { padding: 8px 18px; color: white; border: none; border-radius: 4px;
                 cursor: pointer; font-size: 14px; }
        .btn-blau  { background: #1a5276; }  .btn-blau:hover  { background: #154360; }
        .btn-verd  { background: #28a745; }  .btn-verd:hover  { background: #218838; }
        .btn-port  { background: #e67e22; }  .btn-port:hover  { background: #ca6f1e; }
        .btn-lila  { background: #8e44ad; }  .btn-lila:hover  { background: #7d3c98; }
        .btn-gris  { background: #888; }
        .cita-item { padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px;
                     margin: 5px 0; display: flex; justify-content: space-between;
                     align-items: center; font-size: 14px; }
        .cita-item.finalitzada { background: #eafaf1; border-color: #28a745; }
        .cita-item.pendent    { background: #fef9e7; border-color: #f39c12; }
        .estat { font-weight: bold; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .estat-finalitzada { background: #28a745; color: white; }
        .estat-pendent     { background: #f39c12; color: white; }
        .estat-confirmada  { background: #1a5276; color: white; }
        .info-box { background: #f0f5fb; padding: 10px 15px; border-radius: 6px;
                    margin: 8px 0; font-size: 14px; }
        .ok  { color: #28a745; font-weight: bold; }
        .err { color: #c0392b; font-weight: bold; }
        .back a { color: #1a5276; text-decoration: none; font-size: 14px; }
        .hidden { display: none; }
        .badge-info { background: #d5e8f3; color: #1a5276; padding: 2px 8px;
                      border-radius: 10px; font-size: 12px; margin-left: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="back"><a href="dashboard.html">Tornar al dashboard</a></div>
    <h1>Gestio Clinica del Metge</h1>

    <!-- SECCIO A: Buscar pacient -->
    <div class="card blau">
        <h2>Buscar Pacient</h2>
        <label>DNI del Pacient:</label>
        <input type="text" id="dni-pacient" placeholder="Ex: 95477263P"
               oninput="this.value=this.value.toUpperCase()">
        <div class="btn-row">
            <button class="btn-blau" onclick="carregarPacient()">Carregar pacient</button>
        </div>
    </div>

    <!-- SECCIO B: Info pacient + cites -->
    <div id="sec-pacient" class="card blau hidden">
        <h2>Pacient: <span id="nom-pacient"></span></h2>
        <div id="info-pacient" class="info-box"></div>
        <label style="margin-top:12px">Cites amb tu (finalitzades per diagnosticar):</label>
        <div id="llista-cites"></div>
    </div>

    <!-- SECCIO C: Crear Diagnostic -->
    <div id="sec-diagnostic" class="card verd hidden">
        <h2>Nou Diagnostic <span id="lbl-cita-diag" class="badge-info"></span></h2>
        <label>Codi Diagnostic (auto):</label>
        <input type="text" id="codi-diag" readonly style="background:#f0f0f0">
        <label>Descripcio:</label>
        <input type="text" id="desc-diag" placeholder="Patologia observada...">
        <label>Notes cliniques (opcional):</label>
        <textarea id="notes-diag" placeholder="Observacions addicionals..."></textarea>
        <div class="btn-row">
            <button class="btn-verd" onclick="crearDiagnostic()">Crear Diagnostic</button>
            <button class="btn-gris" onclick="tancarSeccio('sec-diagnostic')">Cancel·lar</button>
        </div>
        <p id="msg-diag" class="ok"></p>
    </div>

    <!-- SECCIO D: Crear Tractament -->
    <div id="sec-tractament" class="card taronja hidden">
        <h2>Nou Tractament <span id="lbl-diag-trac" class="badge-info"></span></h2>
        <label>Codi Tractament (auto):</label>
        <input type="text" id="codi-trac" readonly style="background:#f0f0f0">
        <label>Data inici:</label>
        <input type="date" id="data-inici-trac">
        <label>Data fi prevista:</label>
        <input type="date" id="data-fi-trac">
        <label>Indicacions:</label>
        <textarea id="indicacions-trac" placeholder="Indicacions terapeutiques generals..."></textarea>
        <div class="btn-row">
            <button class="btn-port" onclick="crearTractament()">Crear Tractament</button>
            <button class="btn-gris" onclick="tancarSeccio('sec-tractament')">Cancel·lar</button>
        </div>
        <p id="msg-trac" class="ok"></p>
    </div>

    <!-- SECCIO E: Crear Prescripcio -->
    <div id="sec-prescripcio" class="card lila hidden">
        <h2>Nova Prescripcio <span id="lbl-trac-presc" class="badge-info"></span></h2>
        <label>Codi Prescripcio (auto):</label>
        <input type="text" id="codi-presc" readonly style="background:#f0f0f0">
        <label>Cercar Medicament (nom comercial):</label>
        <div style="display:flex;gap:8px">
            <input type="text" id="cerca-med" placeholder="Ex: Ibuprofèn Cinfa">
            <button class="btn-lila" onclick="cercarMedicament()" style="width:auto;white-space:nowrap">Cercar</button>
        </div>
        <div id="resultats-med" style="margin-top:6px"></div>
        <label>Codi Nacional seleccionat:</label>
        <input type="text" id="codi-nacional" placeholder="Ex: CN125611" readonly style="background:#f0f0f0">
        <label>Dosi:</label>
        <input type="text" id="dosi-presc" placeholder="Ex: 400mg">
        <label>Frequencia:</label>
        <input type="text" id="freq-presc" placeholder="Ex: Cada 8 hores">
        <label>Durada:</label>
        <input type="text" id="durada-presc" placeholder="Ex: 7 dies">
        <div class="btn-row">
            <button class="btn-lila" onclick="crearPrescripcio()">Crear Prescripcio</button>
            <button class="btn-gris" onclick="tancarSeccio('sec-prescripcio')">Cancel·lar</button>
        </div>
        <p id="msg-presc" class="ok"></p>
    </div>

</div>
<script>
var API    = 'http://127.0.0.1:8000';
var usuari = JSON.parse(localStorage.getItem('usuari') || 'null');
if (!usuari) window.location.href = 'login.html';

// Llegir DNI de la URL si ve des de llistatPacients
var params = new URLSearchParams(window.location.search);
var dniUrl = params.get('dni');
if (dniUrl) {
    window.addEventListener('load', function() {
        document.getElementById('dni-pacient').value = dniUrl.toUpperCase();
        carregarPacient();
    });
}

var codiCitaActual   = null;
var codiDiagActual   = null;
var codiTracActual   = null;

function genCodi(prefix, digits) {
    var n = '';
    for (var i = 0; i < digits; i++) n += Math.floor(Math.random() * 10);
    return prefix + n;
}

function tancarSeccio(id) {
    document.getElementById(id).classList.add('hidden');
}

function mostrar(id) {
    document.getElementById(id).classList.remove('hidden');
    document.getElementById(id).scrollIntoView({behavior: 'smooth'});
}

// ── A: Carregar pacient ──────────────────────────────────────────────────────
async function carregarPacient() {
    var dni = document.getElementById('dni-pacient').value.trim().toUpperCase();
    if (!dni) { alert('Introdueix el DNI del pacient.'); return; }

    try {
        var r    = await fetch(API + '/historial/?dni=' + dni + '&dni_metge=' + usuari.dni);
        var data = await r.json();

        if (data.status !== 'exit' && !data.status.includes('xit')) {
            alert('Error: ' + (data.missatge || 'Pacient no trobat.'));
            return;
        }

        var h = data.historial;
        document.getElementById('nom-pacient').textContent = h.nom_pacient;
        document.getElementById('info-pacient').innerHTML =
            '<b>Grup sanguini:</b> ' + h.grup_sanguini +
            ' &nbsp;|&nbsp; <b>Al·lergies:</b> ' + (h.allergies || 'Cap') +
            ' &nbsp;|&nbsp; <b>Malalties croniques:</b> ' + (h.malalties_croniques || 'Cap');

        var cites = data.historial_clinic_complet || [];
        var html  = '';
        cites.forEach(function(c) {
            var cls = 'cita-item ' + c.estat;
            html += '<div class="' + cls + '">';
            html += '<span><b>' + c.codi_cita + '</b> &mdash; ' + c.data + ' ' + c.hora
                 + ' <span class="estat estat-' + c.estat + '">' + c.estat + '</span></span>';
            if (c.estat === 'finalitzada') {
                html += '<button class="btn-verd" style="padding:4px 10px;font-size:12px" '
                      + 'onclick="obrirDiagnostic(\'' + c.codi_cita + '\')">+ Diagnostic</button>';
            }
            html += '</div>';
        });
        if (!html) html = '<p style="color:#999">Cap cita amb aquest metge.</p>';
        document.getElementById('llista-cites').innerHTML = html;
        mostrar('sec-pacient');

    } catch(e) { alert('Error de connexio amb el servidor.'); }
}

// ── C: Diagnostic ────────────────────────────────────────────────────────────
function obrirDiagnostic(codiCita) {
    codiCitaActual = codiCita;
    document.getElementById('codi-diag').value = genCodi('DG', 8);
    document.getElementById('desc-diag').value = '';
    document.getElementById('notes-diag').value = '';
    document.getElementById('msg-diag').textContent = '';
    document.getElementById('lbl-cita-diag').textContent = 'Cita: ' + codiCita;
    mostrar('sec-diagnostic');
}

async function crearDiagnostic() {
    var dades = {
        codi_diagnostic : document.getElementById('codi-diag').value,
        descripcio      : document.getElementById('desc-diag').value.trim(),
        notes_cliniques : document.getElementById('notes-diag').value.trim(),
        codi_cita       : codiCitaActual
    };
    if (!dades.descripcio) { alert('La descripcio es obligatoria.'); return; }
    try {
        var r       = await fetch(API + '/diagnostics/', {
            method : 'POST', headers: {'Content-Type': 'application/json'},
            body   : JSON.stringify(dades)
        });
        var resultat = await r.json();
        if (r.status === 201) {
            codiDiagActual = dades.codi_diagnostic;
            document.getElementById('msg-diag').textContent =
                'Diagnostic ' + codiDiagActual + ' creat correctament.';
            // Prepara tractament
            document.getElementById('codi-trac').value = genCodi('TR', 8);
            document.getElementById('data-inici-trac').value = new Date().toISOString().split('T')[0];
            var fi = new Date(); fi.setMonth(fi.getMonth() + 1);
            document.getElementById('data-fi-trac').value = fi.toISOString().split('T')[0];
            document.getElementById('indicacions-trac').value = '';
            document.getElementById('msg-trac').textContent = '';
            document.getElementById('lbl-diag-trac').textContent = 'Diagnostic: ' + codiDiagActual;
            mostrar('sec-tractament');
        } else {
            alert('Error: ' + (resultat.missatge || resultat.message || 'Error desconegut'));
        }
    } catch(e) { alert('Error de connexio.'); }
}

// ── D: Tractament ────────────────────────────────────────────────────────────
async function crearTractament() {
    var dades = {
        codi_tractament  : document.getElementById('codi-trac').value,
        data_inici       : document.getElementById('data-inici-trac').value,
        data_fi_prevista : document.getElementById('data-fi-trac').value,
        indicacions      : document.getElementById('indicacions-trac').value.trim(),
        codi_diagnostic  : codiDiagActual
    };
    if (!dades.data_inici || !dades.data_fi_prevista) {
        alert('Les dates son obligatories.'); return;
    }
    try {
        var r        = await fetch(API + '/tractaments/', {
            method : 'POST', headers: {'Content-Type': 'application/json'},
            body   : JSON.stringify(dades)
        });
        var resultat = await r.json();
        if (r.status === 201) {
            codiTracActual = dades.codi_tractament;
            document.getElementById('msg-trac').textContent =
                'Tractament ' + codiTracActual + ' creat correctament.';
            // Prepara prescripcio
            document.getElementById('codi-presc').value = genCodi('PRE', 8);
            document.getElementById('codi-nacional').value = '';
            document.getElementById('dosi-presc').value = '';
            document.getElementById('freq-presc').value = '';
            document.getElementById('durada-presc').value = '';
            document.getElementById('msg-presc').textContent = '';
            document.getElementById('lbl-trac-presc').textContent = 'Tractament: ' + codiTracActual;
            mostrar('sec-prescripcio');
        } else {
            alert('Error: ' + (resultat.message || resultat.missatge || 'Error desconegut'));
        }
    } catch(e) { alert('Error de connexio.'); }
}

// ── E: Prescripcio ───────────────────────────────────────────────────────────
async function cercarMedicament() {
    var nom = document.getElementById('cerca-med').value.trim();
    if (!nom) { alert('Introdueix un nom per cercar.'); return; }
    try {
        var r    = await fetch(API + '/medicaments/?nom_comercial=' + encodeURIComponent(nom));
        var data = await r.json();
        var div  = document.getElementById('resultats-med');
        if (data.medicaments && data.medicaments.length > 0) {
            div.innerHTML = data.medicaments.slice(0, 8).map(function(m) {
                return '<div style="padding:4px 8px;border:1px solid #ccc;border-radius:4px;margin:3px 0;'
                     + 'cursor:pointer;font-size:13px;background:#fafafa" '
                     + 'onclick="seleccionarMed(\'' + m.codi_nacional + '\',\'' + m.nom_comercial + '\')">'
                     + '<b>' + m.codi_nacional + '</b> — ' + m.nom_comercial + ' (' + m.principi_actiu + ')'
                     + '</div>';
            }).join('');
        } else {
            div.innerHTML = '<p style="color:#999;font-size:13px">Cap medicament trobat.</p>';
        }
    } catch(e) { alert('Error de connexio.'); }
}

function seleccionarMed(codi, nom) {
    document.getElementById('codi-nacional').value = codi;
    document.getElementById('resultats-med').innerHTML =
        '<p style="color:#28a745;font-size:13px">Seleccionat: <b>' + nom + '</b> (' + codi + ')</p>';
}

async function crearPrescripcio() {
    var dades = {
        codi_prescripcio: document.getElementById('codi-presc').value,
        codi_tractament : codiTracActual,
        codi_nacional   : document.getElementById('codi-nacional').value.trim(),
        dosi            : document.getElementById('dosi-presc').value.trim(),
        frequencia      : document.getElementById('freq-presc').value.trim(),
        durada          : document.getElementById('durada-presc').value.trim(),
        estat           : 'activa'
    };
    if (!dades.codi_nacional || !dades.dosi || !dades.frequencia || !dades.durada) {
        alert('Omple tots els camps de la prescripcio.'); return;
    }
    try {
        var r        = await fetch(API + '/prescripcions/', {
            method : 'POST', headers: {'Content-Type': 'application/json'},
            body   : JSON.stringify(dades)
        });
        var resultat = await r.json();
        var msg      = document.getElementById('msg-presc');
        if (r.status === 201) {
            msg.className   = 'ok';
            msg.textContent = 'Prescripcio creada! Codi: ' + dades.codi_prescripcio;
            alert('Flux complet: Diagnostic -> Tractament -> Prescripcio creats correctament.');
        } else {
            msg.className   = 'err';
            msg.textContent = 'Error: ' + (resultat.missatge || 'Error desconegut');
            alert('Error: ' + (resultat.missatge || 'Error desconegut'));
        }
    } catch(e) { alert('Error de connexio.'); }
}
</script>
</body>
</html>
