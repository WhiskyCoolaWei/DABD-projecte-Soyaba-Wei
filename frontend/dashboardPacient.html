<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>HealthLog - Portal del Pacient</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f7; min-height: 100vh; }

        .topbar { background: #1e8449; color: white; padding: 14px 30px;
                  display: flex; justify-content: space-between; align-items: center; }
        .topbar h1 { font-size: 20px; font-weight: 600; }
        .topbar .user { font-size: 14px; opacity: 0.9; }
        .topbar .btn-out { background: rgba(255,255,255,0.2); border: none; color: white;
                           padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; }
        .topbar .btn-out:hover { background: rgba(255,255,255,0.35); }

        .container { max-width: 860px; margin: 25px auto; padding: 0 20px 40px; }

        .back { margin-bottom: 15px; }
        .back a { color: #1e8449; text-decoration: none; font-size: 14px; font-weight: 500; }
        .back a:hover { text-decoration: underline; }

        /* Cards */
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
                margin-bottom: 18px; overflow: hidden; }
        .card-header { padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
        .card-header.verd    { background: linear-gradient(135deg, #1e8449, #27ae60); color: white; }
        .card-header.blau    { background: linear-gradient(135deg, #1a5276, #2874a6); color: white; }
        .card-header.taronja { background: linear-gradient(135deg, #b7950b, #d4ac0d); color: white; }
        .card-header h2 { font-size: 15px; font-weight: 600; }
        .card-body { padding: 18px 20px; }

        /* Historial grid */
        .hgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .hitem { background: #f8fffe; border: 1px solid #d5f5e3; border-radius: 8px; padding: 10px 14px; }
        .hitem .lbl { font-size: 11px; text-transform: uppercase; color: #888; font-weight: 600; letter-spacing: 0.5px; }
        .hitem .val { font-size: 14px; color: #2c3e50; margin-top: 3px; font-weight: 500; }

        /* Timeline cites */
        .timeline { position: relative; padding-left: 22px; }
        .timeline::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0;
                             width: 2px; background: #dde; }
        .titem { position: relative; margin-bottom: 14px; }
        .titem::before { content: ''; position: absolute; left: -19px; top: 6px;
                         width: 10px; height: 10px; border-radius: 50%; background: #1a5276; border: 2px solid white;
                         box-shadow: 0 0 0 2px #1a5276; }
        .titem.finalitzada::before { background: #27ae60; box-shadow: 0 0 0 2px #27ae60; }
        .titem.pendent::before     { background: #f39c12; box-shadow: 0 0 0 2px #f39c12; }
        .titem.cancel-lada::before { background: #bbb;    box-shadow: 0 0 0 2px #bbb; }

        .cita-cap { display: flex; justify-content: space-between; align-items: center;
                    background: #f8f9fa; border-radius: 8px; padding: 10px 14px; }
        .cita-data { font-size: 14px; font-weight: 600; color: #2c3e50; }
        .cita-meta { font-size: 12px; color: #888; margin-top: 2px; }
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; color: white; }
        .badge.finalitzada { background: #27ae60; }
        .badge.pendent     { background: #f39c12; }
        .badge.confirmada  { background: #1a5276; }
        .badge.cancel-lada { background: #bbb; }

        .diag-list { margin-top: 8px; padding-left: 5px; }
        .diag-item { background: #f0f9f4; border-left: 3px solid #27ae60; border-radius: 0 6px 6px 0;
                     padding: 8px 12px; margin: 6px 0; font-size: 13px; }
        .diag-title { font-weight: 600; color: #1e8449; margin-bottom: 3px; }
        .diag-notes { color: #555; font-size: 12px; }
        .trac-item { background: #fff8e1; border-left: 3px solid #f39c12; border-radius: 0 6px 6px 0;
                     padding: 7px 12px; margin: 5px 0 0 15px; font-size: 12px; color: #555; }
        .trac-title { font-weight: 600; color: #b7770d; }

        /* Prescripcions */
        .presc-table { width: 100%; border-collapse: collapse; }
        .presc-table th { background: #fef9e7; color: #b7770d; font-size: 12px;
                          text-transform: uppercase; letter-spacing: 0.4px; padding: 8px 12px;
                          text-align: left; border-bottom: 2px solid #fdebd0; }
        .presc-table td { padding: 9px 12px; border-bottom: 1px solid #fef5e4; font-size: 13px; }
        .presc-table tr:last-child td { border-bottom: none; }
        .presc-table tr:hover td { background: #fffbf0; }
        .pill-activa  { background: #d5f5e3; color: #1e8449; padding: 2px 8px;
                        border-radius: 10px; font-size: 11px; font-weight: 600; }
        .pill-final   { background: #eee; color: #888; padding: 2px 8px;
                        border-radius: 10px; font-size: 11px; font-weight: 600; }

        .buit { color: #aaa; font-size: 14px; font-style: italic; padding: 12px 0; text-align: center; }
    </style>
</head>
<body>

<div class="topbar">
    <h1>HealthLog — Portal del Pacient</h1>
    <div style="display:flex;align-items:center;gap:15px">
        <span class="user" id="nom-user"></span>
        <button class="btn-out" onclick="logout()">Tancar sessio</button>
    </div>
</div>

<div class="container">
    <div class="back"><a href="dashboard.html">← Tornar al dashboard</a></div>

    <!-- Historial base -->
    <div class="card">
        <div class="card-header verd">
            <h2>Historial Clinic</h2>
        </div>
        <div class="card-body">
            <div id="info-historial" class="hgrid">
                <div class="buit">Carregant...</div>
            </div>
        </div>
    </div>

    <!-- Cites -->
    <div class="card">
        <div class="card-header blau">
            <h2>Historial de Visites</h2>
        </div>
        <div class="card-body">
            <div id="llista-cites" class="timeline">
                <div class="buit">Carregant...</div>
            </div>
        </div>
    </div>

    <!-- Prescripcions -->
    <div class="card">
        <div class="card-header taronja">
            <h2>Prescripcions</h2>
        </div>
        <div class="card-body">
            <div id="llista-prescripcions">
                <div class="buit">Carregant...</div>
            </div>
        </div>
    </div>
</div>

<script>
var API    = 'http://127.0.0.1:8000';
var usuari = JSON.parse(localStorage.getItem('usuari') || 'null');
if (!usuari || !usuari.dni) { window.location.href = 'login.html'; }
// Guarda de rol: si aquest compte no te rol de pacient, no pertany a aquest portal
if (usuari && (!usuari.rols || usuari.rols.indexOf('pacient') === -1)) { window.location.href = 'dashboard.html'; }
document.getElementById('nom-user').textContent = usuari ? usuari.nom : '';

// El link "Tornar al dashboard" nomes te sentit si tambe ets metge (overlapping)
if (usuari && (!usuari.rols || usuari.rols.indexOf('metge') === -1)) {
    var back = document.querySelector('.back');
    if (back) back.style.display = 'none';
}

async function carregarHistorial() {
    try {
        var r    = await fetch(API + '/historial/?dni=' + usuari.dni);
        var data = await r.json();
        if (!data.status.includes('xit') && data.status !== 'exit') {
            document.getElementById('info-historial').innerHTML = '<div class="buit">Historial no trobat.</div>';
            return;
        }

        var h = data.historial;
        document.getElementById('info-historial').innerHTML =
            '<div class="hitem"><div class="lbl">Grup sanguini</div><div class="val">' + (h.grup_sanguini||'No informat') + '</div></div>'
          + '<div class="hitem"><div class="lbl">Al·lergies</div><div class="val">' + (h.allergies||'Cap coneguda') + '</div></div>'
          + '<div class="hitem"><div class="lbl">Antecedents</div><div class="val">' + (h.antecedents||'Cap') + '</div></div>'
          + '<div class="hitem"><div class="lbl">Malalties croniques</div><div class="val">' + (h.malalties_croniques||'Cap') + '</div></div>';

        var cites = data.historial_clinic_complet || [];
        var html  = '';
        var tractamentsCodis = [];

        cites.slice(0, 15).forEach(function(c) {
            var estatCls = c.estat.replace('·','');
            html += '<div class="titem ' + estatCls + '">';
            html += '<div class="cita-cap">'
                  + '<div><div class="cita-data">' + c.data + ' a les ' + c.hora + '</div>'
                  + '<div class="cita-meta">Metge: ' + c.dni_metge + '</div></div>'
                  + '<span class="badge ' + estatCls + '">' + c.estat + '</span>'
                  + '</div>';

            if (c.diagnostics && c.diagnostics.length > 0) {
                html += '<div class="diag-list">';
                c.diagnostics.forEach(function(d) {
                    html += '<div class="diag-item">'
                          + '<div class="diag-title">' + d.descripcio + '</div>';
                    if (d.notes_cliniques) {
                        html += '<div class="diag-notes">' + d.notes_cliniques + '</div>';
                    }
                    if (d.tractaments && d.tractaments.length > 0) {
                        d.tractaments.forEach(function(t) {
                            tractamentsCodis.push(t.codi_tractament);
                            html += '<div class="trac-item">'
                                  + '<span class="trac-title">Tractament:</span> '
                                  + (t.indicacions || 'Sense indicacions')
                                  + ' <em>(fins ' + t.data_fi_prevista + ')</em>'
                                  + '</div>';
                        });
                    }
                    html += '</div>';
                });
                html += '</div>';
            }
            html += '</div>';
        });

        document.getElementById('llista-cites').innerHTML =
            html || '<div class="buit">Cap visita registrada.</div>';

        if (tractamentsCodis.length > 0) {
            carregarPrescripcions(tractamentsCodis[0]);
        } else {
            document.getElementById('llista-prescripcions').innerHTML =
                '<div class="buit">Cap prescripcio registrada.</div>';
        }

    } catch(e) {
        document.getElementById('info-historial').innerHTML =
            '<div class="buit">Error de connexio.</div>';
    }
}

async function carregarPrescripcions(codiTractament) {
    try {
        var r    = await fetch(API + '/prescripcions/?codi_tractament=' + codiTractament);
        var data = await r.json();
        var div  = document.getElementById('llista-prescripcions');

        if (!data.prescripcions || data.prescripcions.length === 0) {
            div.innerHTML = '<div class="buit">Cap prescripcio registrada.</div>';
            return;
        }

        var html = '<table class="presc-table"><thead><tr>'
                 + '<th>Medicament</th><th>Dosi</th><th>Frequencia</th><th>Durada</th><th>Estat</th>'
                 + '</tr></thead><tbody>';
        data.prescripcions.forEach(function(p) {
            var pill = p.estat === 'activa'
                ? '<span class="pill-activa">Activa</span>'
                : '<span class="pill-final">Finalitzada</span>';
            html += '<tr><td><b>' + p.codi_nacional + '</b></td>'
                  + '<td>' + p.dosi + '</td>'
                  + '<td>' + p.frequencia + '</td>'
                  + '<td>' + p.durada + '</td>'
                  + '<td>' + pill + '</td></tr>';
        });
        html += '</tbody></table>';
        div.innerHTML = html;
    } catch(e) {}
}

function logout() {
    localStorage.removeItem('usuari');
    window.location.href = 'login.html';
}

carregarHistorial();
</script>
</body>
</html>
