<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Pacient - HealthLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 10px; }
        .badge-estat-pendent    { background-color: #ffc107; color: #000; }
        .badge-estat-confirmada { background-color: #198754; color: #fff; }
        .badge-estat-finalitzada{ background-color: #6c757d; color: #fff; }
        .badge-estat-cancelada  { background-color: #dc3545; color: #fff; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <span class="navbar-brand">🏥 HealthLog — Àrea del Pacient</span>
        <div class="d-flex align-items-center text-white gap-3">
            <span>Benvingut/da, <strong id="nomPacient">...</strong></span>
            <span class="badge bg-light text-primary py-2 px-3 fw-bold" id="dniDisplay"></span>
            <button class="btn btn-outline-light btn-sm" onclick="tancarSessio()">Sortir</button>
        </div>
    </div>
</nav>
<div id="banner-metge" style="display:none" class="container mt-2 mb-0">
    <a href="dashboard.html" class="btn btn-warning btn-sm fw-bold">
        Tornar al Panell del Metge
    </a>
</div>
        </div>
    </div>
</nav>
<div class="container">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card p-4 shadow-sm bg-white">
                <h5 class="text-primary border-bottom pb-2 mb-3">Fitxa Clínica</h5>
                <div class="mb-2"><strong>Grup Sanguini:</strong> <span id="grupSanguini" class="text-muted">—</span></div>
                <div class="mb-2"><strong>Al·lèrgies:</strong> <span id="allergies" class="text-muted">—</span></div>
                <div class="mb-2"><strong>Malalties Cròniques:</strong> <span id="malaltiesCroniques" class="text-muted">—</span></div>
                <div class="mb-3"><strong>Antecedents:</strong> <p id="antecedents" class="text-muted small mt-1 mb-0">—</p></div>
                <hr>
                <button class="btn btn-outline-primary w-100 fw-bold"
                        onclick="window.location.href='historialClinic.html'">
                    📄 Veure Historial Complet
                </button>
            </div>
        </div>
        <div class="col-md-8 mb-4">
            <div class="card p-4 shadow-sm bg-white mb-4">
                <h5 class="text-success border-bottom pb-2 mb-3">📅 Properes Cites</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr><th>Codi</th><th>Data</th><th>Hora</th><th>Metge (DNI)</th><th>Estat</th></tr>
                        </thead>
                        <tbody id="taula-properes">
                            <tr><td colspan="5" class="text-center text-muted py-3">Carregant...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card p-4 shadow-sm bg-white">
                <h5 class="text-secondary border-bottom pb-2 mb-3">🗂️ Historial de Cites</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr><th>Codi</th><th>Data</th><th>Hora</th><th>Metge (DNI)</th><th>Estat</th></tr>
                        </thead>
                        <tbody id="taula-historial">
                            <tr><td colspan="5" class="text-center text-muted py-3">Carregant...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const API = 'http://localhost:8000';
    const dniPacient = localStorage.getItem('pacient_dni');
    const nomPacient = localStorage.getItem('pacient_nom');

    document.addEventListener('DOMContentLoaded', () => {
        const usuari = JSON.parse(localStorage.getItem('usuari') || 'null');
        if (usuari && usuari.rols && usuari.rols.includes('metge')) {
            const b = document.getElementById('banner-metge');
            if (b) b.style.display = 'block';
        }
        if (!dniPacient) { window.location.href = 'login.html'; return; }
        document.getElementById('nomPacient').textContent = nomPacient || '—';
        document.getElementById('dniDisplay').textContent  = dniPacient;
        carregarDades();
    });

    async function carregarDades() {
        try {
            const res  = await fetch(API + '/historial/?dni=' + dniPacient);
            const data = await res.json();
            if (data.status !== 'èxit') { mostrarError(data.missatge); return; }
            const h = data.historial;
            document.getElementById('grupSanguini').textContent      = h.grup_sanguini;
            document.getElementById('allergies').textContent          = h.allergies;
            document.getElementById('malaltiesCroniques').textContent = h.malalties_croniques;
            document.getElementById('antecedents').textContent        = h.antecedents;
            const totes   = data.historial_clinic_complet || [];
            const actives = totes.filter(c => ['pendent','confirmada'].includes(c.estat));
            const passades = totes.filter(c => !['pendent','confirmada'].includes(c.estat));
            renderTaula('taula-properes',  actives,  'No tens cites programades.');
            renderTaula('taula-historial', passades, 'No hi ha cites anteriors registrades.');
        } catch (e) { mostrarError('Error de connexio amb el servidor.'); }
    }

    function renderTaula(idTabla, cites, msgBuit) {
        const tbody = document.getElementById(idTabla);
        if (!cites || cites.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">' + msgBuit + '</td></tr>';
            return;
        }
        const cls = { pendent:'badge-estat-pendent', confirmada:'badge-estat-confirmada',
                      finalitzada:'badge-estat-finalitzada', cancelada:'badge-estat-cancelada' };
        tbody.innerHTML = cites.map(c =>
            '<tr><td><small class="font-monospace fw-bold">' + c.codi_cita + '</small></td>' +
            '<td>' + c.data + '</td><td>' + c.hora + '</td>' +
            '<td><small>' + c.dni_metge + '</small></td>' +
            '<td><span class="badge ' + (cls[c.estat]||'bg-secondary text-white') + '">' + c.estat + '</span></td></tr>'
        ).join('');
    }

    function mostrarError(msg) {
        const fila = '<tr><td colspan="5" class="text-center text-danger">Avís: ' + msg + '</td></tr>';
        document.getElementById('taula-properes').innerHTML  = fila;
        document.getElementById('taula-historial').innerHTML = fila;
    }

    function tancarSessio() {
        localStorage.removeItem('usuari');
        localStorage.removeItem('pacient_dni');
        localStorage.removeItem('pacient_nom');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
