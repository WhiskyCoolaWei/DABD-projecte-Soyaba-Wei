<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
    <title>Llistat de Prescripcions</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .table-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 1000px; }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; margin-bottom: 25px; }
        
        .filter-box { display: flex; gap: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 25px; align-items: flex-end; border: 1px solid #e4e7ed; flex-wrap: wrap; }
        .input-group { display: flex; flex-direction: column; flex: 1; min-width: 180px; }
        .input-group label { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; }
        .input-group input { padding: 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; }
        
        button { padding: 11px 25px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; height: 38px; }
        button:hover { background-color: #2980b9; }
        button.btn-clear { background-color: #909399; }
        button.btn-clear:hover { background-color: #73767a; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #f8f9fa; color: #2c3e50; font-weight: 600; cursor: pointer; user-select: none; }
        th:hover { background-color: #eef2f5; color: #3498db; }
        tr:hover { background-color: #f1f5f9; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; color: white; font-weight: bold; text-transform: uppercase; }
        .badge-activa { background-color: #2ecc71; }
        .badge-finalitzada { background-color: #e74c3c; }

        .pagination-box { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 25px; }
        .pagination-box button { height: auto; padding: 8px 16px; background-color: #fff; color: #3498db; border: 1px solid #3498db; }
        .pagination-box button:disabled { color: #c0c4cc; border-color: #e4e7ed; cursor: not-allowed; }
        
        .loading { text-align: center; color: #7f8c8d; font-style: italic; padding: 20px; }
    </style>
</head>
<body>

<div class="table-container">
    <h2>Historial de Prescripcions Mèdiques</h2>
    
    <div class="filter-box">
        <div class="input-group">
            <label>Codi Prescripció:</label>
            <input type="text" id="filtre_codi" placeholder="Ex: PRE12345678">
        </div>
        <div class="input-group">
            <label>Codi Tractament:</label>
            <input type="text" id="filtre_trac" placeholder="Ex: TR87654321">
        </div>
        <div class="input-group">
            <label>Codi Nacional:</label>
            <input type="text" id="filtre_nac" placeholder="Ex: CN123456">
        </div>
        <button type="button" id="btnFiltrar">Filtrar</button>
        <button type="button" class="btn-clear" id="btnNetejar">Netejar</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th id="th_codi">Codi Prescripció ↕</th>
                <th id="th_trac">Codi Tractament ↕</th>
                <th id="th_nac">Codi Nacional ↕</th>
                <th>Dosi / Freqüència</th>
                <th>Durada</th>
                <th>Estat</th>
            </tr>
        </thead>
        <tbody id="taula_prescripcions">
            <tr>
                <td colspan="6" class="loading">Carregant prescripcions...</td>
            </tr>
        </tbody>
    </table>

    <div class="pagination-box">
        <button id="btnPrev" disabled>Anterior</button>
        <span id="infoPagina">Pàgina 1 de 1</span>
        <button id="btnNext" disabled>Següent</button>
    </div>
</div>

<script>
let paginaActual = 1;
let ordreActual = '';

async function carregarPrescripcions() {
    const taulaBody = document.getElementById('taula_prescripcions');
    taulaBody.innerHTML = '<tr><td colspan="6" class="loading">Cercant registres...</td></tr>';
    
    const codi = document.getElementById('filtre_codi').value.trim();
    const trac = document.getElementById('filtre_trac').value.trim();
    const nac = document.getElementById('filtre_nac').value.trim();
    
    try {
        const params = new URLSearchParams();
        params.append('pagina', paginaActual);
        if (codi) params.append('codi_prescripcio', codi);
        if (trac) params.append('codi_tractament', trac);
        if (nac) params.append('codi_nacional', nac);
        if (ordreActual) params.append('ordenar_per', ordreActual);

        const resposta = await fetch(`http://127.0.0.1:8000/prescripcions/?${params.toString()}`);
        const dada = await resposta.json();
        
        taulaBody.innerHTML = ''; 

        if (dada.status === "èxit" && dada.prescripcions.length > 0) {
            dada.prescripcions.forEach(p => {
                const fila = document.createElement('tr');
                const badgeClass = p.estat === 'activa' ? 'badge-activa' : 'badge-finalitzada';
                
                fila.innerHTML = `
                    <td><strong>${p.codi_prescripcio}</strong></td>
                    <td>${p.codi_tractament}</td>
                    <td>${p.codi_nacional}</td>
                    <td>${p.dosi} <br><small style="color:#777">${p.frequencia}</small></td>
                    <td>${p.durada}</td>
                    <td><span class="badge ${badgeClass}">${p.estat}</span></td>
                `;
                taulaBody.appendChild(fila);
            });
            
            document.getElementById('infoPagina').textContent = `Pàgina ${dada.paginacio.pagina_actual} de ${dada.paginacio.total_pagines}`;
            document.getElementById('btnPrev').disabled = !dada.paginacio.te_anterior;
            document.getElementById('btnNext').disabled = !dada.paginacio.te_seguent;
        } else {
            taulaBody.innerHTML = '<tr><td colspan="6" class="loading">No s\'ha trobat cap prescripció amb aquests criteris.</td></tr>';
            document.getElementById('infoPagina').textContent = 'Pàgina 1 de 1';
            document.getElementById('btnPrev').disabled = true;
            document.getElementById('btnNext').disabled = true;
        }
    } catch (e) {
        taulaBody.innerHTML = '<tr><td colspan="6" style="color: red; text-align: center;">❌ Error de connexió amb el servidor.</td></tr>';
    }
}

function gestionarOrdre(camp) {
    if (ordreActual === camp) { ordreActual = `-${camp}`; } 
    else if (ordreActual === `-${camp}`) { ordreActual = ''; } 
    else { ordreActual = camp; }
    paginaActual = 1; 
    carregarPrescripcions();
}

// Escuchadores exclusivos para las columnas de identificadores permitidas
document.getElementById('th_codi').addEventListener('click', () => gestionarOrdre('codi_prescripcio'));
document.getElementById('th_trac').addEventListener('click', () => gestionarOrdre('codi_tractament'));
document.getElementById('th_nac').addEventListener('click', () => gestionarOrdre('codi_nacional'));

document.getElementById('btnFiltrar').addEventListener('click', () => { paginaActual = 1; carregarPrescripcions(); });
document.getElementById('btnNetejar').addEventListener('click', () => {
    document.getElementById('filtre_codi').value = '';
    document.getElementById('filtre_trac').value = '';
    document.getElementById('filtre_nac').value = '';
    ordreActual = ''; paginaActual = 1;
    carregarPrescripcions();
});

document.getElementById('btnPrev').addEventListener('click', () => { if (paginaActual > 1) { paginaActual--; carregarPrescripcions(); } });
document.getElementById('btnNext').addEventListener('click', () => { paginaActual++; carregarPrescripcions(); });

window.onload = () => carregarPrescripcions();
</script>
</body>
</html>
