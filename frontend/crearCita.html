<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
    <title>Sistema de Reserva de Cites</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; padding: 40px; }
        .booking-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 450px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #3498db; margin-bottom: 25px; }
        .info-box p { margin: 5px 0; font-size: 14px; color: #7f8c8d; }
        .info-box strong { color: #2c3e50; }
        label { display: block; margin: 15px 0 8px; font-weight: 600; color: #34495e; }
        input { width: 100%; padding: 12px; border: 1px solid #dcdfe6; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        input:focus { border-color: #3498db; outline: none; }
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .time-slot { padding: 10px; border: 1px solid #dcdfe6; border-radius: 6px; text-align: center; cursor: pointer; background: #fff; transition: 0.3s; }
        .time-slot:hover { border-color: #3498db; color: #3498db; }
        .time-slot.selected { background: #3498db; color: white; border-color: #3498db; }
        button#btnReserva { width: 100%; padding: 14px; background-color: #2ecc71; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 30px; cursor: pointer; transition: 0.3s; }
        button#btnReserva:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="booking-card">
    <h2>Reserva de Cita Mèdica</h2>
    
    <div class="info-box">
        <p>Pacient: <strong id="display_pacient">87654321B</strong></p>
        <p>Centre Assignat: <strong id="display_centre">CENTRE-VILADECANS</strong></p>
        <p>Metge: <strong id="display_metge">12345678A</strong></p>
    </div>

    <form id="reservaForm">
        <label>Tria una data:</label>
        <input type="date" id="data_reserva" required min="2024-01-01">

        <label>Selecciona una hora disponible:</label>
        <div class="time-grid" id="timeGrid">
            <div class="time-slot" data-time="09:00">09:00</div>
            <div class="time-slot" data-time="10:00">10:00</div>
            <div class="time-slot" data-time="11:00">11:00</div>
            <div class="time-slot" data-time="12:00">12:00</div>
            <div class="time-slot" data-time="16:00">16:00</div>
            <div class="time-slot" data-time="17:00">17:00</div>
        </div>

        <button type="button" id="btnReserva">Confirmar Reserva</button>
    </form>
</div>

<script>
let selectedTime = null;

document.querySelectorAll('.time-slot').forEach(slot => {
    slot.addEventListener('click', () => {
        document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
        slot.classList.add('selected');
        selectedTime = slot.getAttribute('data-time');
    });
});

document.getElementById('btnReserva').addEventListener('click', async () => {
    const data = document.getElementById('data_reserva').value;
    
    if (!data || !selectedTime) {
        alert("Si us plau, selecciona data i hora.");
        return;
    }

    const reserva = {
        data: data,
        hora: selectedTime,
        dni_pacient: "87654321B", // Dades simulades de login
        dni_metge: "12345678A",   // Dades simulades de login
        codi_centre: "CENTRE-VILADECANS",
        codi_sala: "SALA-04"
    };

    try {
        const resposta = await fetch('http://127.0.0.1:8000/cites/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reserva)
        });

        const resultat = await resposta.json();

        if (resposta.status === 201) {
            alert("✅ " + resultat.missatge);
            window.location.reload();
        } else {
            alert("❌ Error: " + resultat.missatge);
        }
    } catch (e) {
        alert("Error de connexió amb el servidor.");
    }
});
</script>

</body>
</html>
