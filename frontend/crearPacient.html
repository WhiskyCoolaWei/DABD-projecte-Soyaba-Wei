<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
    <title>Alta de Pacient</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 480px; }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
        input { padding: 11px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; }
        input:focus { border-color: #1abc9c; outline: none; }
        button { padding: 14px; background-color: #1abc9c; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; margin-top: 15px; width: 100%; }
        button:hover { background-color: #16a085; }
    </style>
</head>
<body>

<div class="card">
    <h2>Registrar Nou Pacient</h2>
    <form id="formPacient">
        <div class="form-grid">
            <div class="form-group">
                <label>DNI *</label>
                <input type="text" id="dni" required placeholder="Ex: 12345678X">
            </div>
            <div class="form-group">
                <label>Data Naixement *</label>
                <input type="date" id="data_naixement" required>
            </div>
            <div class="form-group">
                <label>Nom *</label>
                <input type="text" id="nom" required placeholder="Nom del pacient">
            </div>
            <div class="form-group">
                <label>Cognoms *</label>
                <input type="text" id="cognoms" required placeholder="Cognoms del pacient">
            </div>
            <div class="form-group">
                <label>Telèfon *</label>
                <input type="tel" id="telefon" required placeholder="Ex: 600112233">
            </div>
            <div class="form-group">
                <label>Correu Electrònic *</label>
                <input type="email" id="correu" required placeholder="Ex: pacient@correu.com">
            </div>
            <div class="form-group full-width">
                <label>Adreça Postal *</label>
                <input type="text" id="adreca" required placeholder="Carrer, Número, Pis, Porta i Ciutat">
            </div>
        </div>
        <button type="submit">Donar d'Alta Pacient</button>
    </form>
</div>

<script>
document.getElementById('formPacient').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const dades = {
        dni: document.getElementById('dni').value,
        nom: document.getElementById('nom').value,
        cognoms: document.getElementById('cognoms').value,
        data_naixement: document.getElementById('data_naixement').value,
        telefon: document.getElementById('telefon').value,
        correu: document.getElementById('correu').value,
        adreca: document.getElementById('adreca').value
    };

    try {
        const resposta = await fetch('http://127.0.0.1:8000/pacients/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dades)
        });
        const data = await resposta.json();
        
        if (resposta.status === 201) {
            alert("✅ " + data.missatge);
            document.getElementById('formPacient').reset();
        } else {
            alert("❌ " + data.missatge);
        }
    } catch (err) {
        alert("❌ Error crític de connexió amb el servidor.");
    }
});
</script>
</body>
</html>
