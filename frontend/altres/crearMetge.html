<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Front-end Desacoblat - Crear Metge</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; }
        h2 { color: #333; margin-top: 0; text-align: center; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; margin-top: 20px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h2>Formulari Nou Metge</h2>
    
    <form id="metgeForm">
        <label>DNI:</label>
        <input type="text" id="dni" required maxlength="9" placeholder="12345678A">

        <label>Nom:</label>
        <input type="text" id="nom" required>

        <label>Cognoms:</label>
        <input type="text" id="cognoms" required>

        <label>Data de Naixement:</label>
        <input type="date" id="data_naixement" required>

        <label>Telèfon:</label>
        <input type="text" id="telefon" required>

        <label>Adreça:</label>
        <input type="text" id="adreca" required>

        <label>Correu Electrònic:</label>
        <input type="email" id="correu" required>

        <label>Número de Col·legiat:</label>
        <input type="text" id="num_collegiat" required placeholder="COL123456">

        <button type="submit">Enviar al Backend</button>
    </form>
</div>

<script>
document.getElementById('metgeForm').addEventListener('submit', async (e) => {
    e.preventDefault(); // Detenemos el envío tradicional del formulario

    // 1. Construimos el objeto con las llaves EXACTAS que espera tu dades['...'] en views.py
    const dadesMediques = {
        dni: document.getElementById('dni').value,
        nom: document.getElementById('nom').value,
        cognoms: document.getElementById('cognoms').value,
        data_naixement: document.getElementById('data_naixement').value, // Envía "YYYY-MM-DD"
        telefon: document.getElementById('telefon').value,
        adreca: document.getElementById('adreca').value,
        correu: document.getElementById('correu').value,
        num_collegiat: document.getElementById('num_collegiat').value
    };

    try {
        // 2. Disparamos la petición HTTP POST a tu servidor local de Django
        const resposta = await fetch('http://127.0.0.1:8000/metges/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dadesMediques) // Serializamos el objeto a string JSON
        });

        // 3. Esperamos la respuesta JSON del controlador
        const resultat = await resposta.json();

        // 4. Analizamos el código de estado HTTP devuelto
        if (resposta.status === 201) {
            alert("🎉 Èxit: " + resultat.missatge);
            document.getElementById('metgeForm').reset(); // Limpiar campos si funciona
        } else {
            // Aquí se pintarán tus "raise ValueError" (DNI repetido, tamaño incorrecto, etc.)
            alert("❌ Error de validació: " + resultat.missatge);
        }

    } catch (error) {
        alert("❌ Error crític: No s'ha pogut connectar amb el servidor Django. Està encès?");
    }
});
</script>

</body>
</html>
