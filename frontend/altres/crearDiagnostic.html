<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Front-end Desacoblat - Crear Diagnòstic</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; }
        h2 { color: #333; margin-top: 0; text-align: center; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #555; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; margin-top: 20px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h2>Formulari Nou Diagnòstic</h2>
    
    <form id="diagnosticForm">
        <label>Codi Diagnòstic:</label>
        <input type="text" id="codi_diagnostic" required pattern="DG\d{8}" maxlength="10" placeholder="DG00000001" title="El codi ha de començar per 'DG' seguit de 8 números">

        <label>Descripció:</label>
        <textarea id="descripcio" rows="3" required></textarea>

        <label>Notes Clíniques (Opcional):</label>
        <textarea id="notes_cliniques" rows="3"></textarea>

        <label>Codi Cita:</label>
        <input type="text" id="codi_cita" required maxlength="15">

        <button type="submit">Enviar al Backend</button>
    </form>
</div>

<script>
document.getElementById('diagnosticForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const dadesDiagnostic = {
        codi_diagnostic: document.getElementById('codi_diagnostic').value,
        descripcio: document.getElementById('descripcio').value,
        notes_cliniques: document.getElementById('notes_cliniques').value || null,
        codi_cita: document.getElementById('codi_cita').value
    };

    try {
        const resposta = await fetch('http://127.0.0.1:8000/diagnostics/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dadesDiagnostic)
        });

        const resultat = await resposta.json();

        if (resposta.status === 201) {
            alert("🎉 Èxit: " + resultat.missatge);
            document.getElementById('diagnosticForm').reset();
        } else {
            alert("❌ Error de validació: " + resultat.missatge);
        }

    } catch (error) {
        alert("❌ Error crític: No s'ha pogut connectar amb el servidor Django. Està encès?");
    }
});
</script>

</body>
</html>
