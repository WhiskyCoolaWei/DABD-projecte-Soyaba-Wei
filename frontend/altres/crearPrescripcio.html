<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Nova Prescripció</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 450px; }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; margin-bottom: 10px; }
        .info-formats { background-color: #e8f4fd; color: #2980b9; padding: 12px; border-radius: 6px; font-size: 12px; margin-bottom: 25px; border-left: 4px solid #3498db; line-height: 1.4; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 18px; }
        label { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
        input, select { padding: 12px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; }
        input:focus, select:focus { border-color: #2ecc71; outline: none; }
        button { padding: 14px; background-color: #2ecc71; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; margin-top: 10px; width: 100%; }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="card">
    <h2>Registrar Nova Prescripció</h2>

    <form id="formCrear">
        <div class="form-group">
            <label>Codi Prescripció:</label>
            <input type="text" id="c_pres" required placeholder="Ex: PRE12345678">
        </div>
        <div class="form-group">
            <label>Codi Tractament:</label>
            <input type="text" id="c_trac" required placeholder="Ex: TR87654321">
        </div>
        <div class="form-group">
            <label>Codi Nacional:</label>
            <input type="text" id="c_nac" required placeholder="Ex: CN123456">
        </div>
        <div class="form-group">
            <label>Dosis:</label>
            <input type="text" id="dosi" required placeholder="Ex: 1 comprimit de 500mg">
        </div>
        <div class="form-group">
            <label>Freqüència:</label>
            <input type="text" id="freq" required placeholder="Ex: Cada 8 hores">
        </div>
        <div class="form-group">
            <label>Durada:</label>
            <input type="text" id="durada" required placeholder="Ex: 7 dies">
        </div>
        <div class="form-group">
            <label>Estat de la Prescripció:</label>
            <select id="estat">
                <option value="activa">Activa</option>
                <option value="finalitzada">Finalitzada</option>
            </select>
        </div>
        <button type="submit">Guardar Prescripció</button>
    </form>
</div>

<script>
document.getElementById('formCrear').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const dades = {
        codi_prescripcio: document.getElementById('c_pres').value.trim(),
        codi_tractament: document.getElementById('c_trac').value.trim(),
        codi_nacional: document.getElementById('c_nac').value.trim(),
        dosi: document.getElementById('dosi').value.trim(),
        frequencia: document.getElementById('freq').value.trim(),
        durada: document.getElementById('durada').value.trim(),
        estat: document.getElementById('estat').value
    };

    try {
        const resposta = await fetch('http://127.0.0.1:8000/prescripcions/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dades)
        });
        
        const data = await resposta.json();
        
        if (resposta.status === 201) {
            alert("✅ " + data.missatge);
            document.getElementById('formCrear').reset();
        } else {
            // Si el Back-end llança un error de format o de validació, es mostrarà aquí directament
            alert("❌ " + data.missatge);
        }
    } catch (err) {
        alert("❌ Error de connexió: No s'ha pogut contactar amb el servidor.");
    }
});
</script>

</body>
</html>
