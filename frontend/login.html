<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>HealthLog – Login</title>
</head>
<body>
  <h1>HealthLog – Iniciar sessio</h1>
  <form id="loginForm">
    <label>Email:<br><input type="email" id="email" required></label><br><br>
    <label>Contrasenya:<br><input type="password" id="contrasenya" required></label><br><br>
    <button type="submit">Entrar</button>
  </form>
  <p id="missatge" style="color:red"></p>
  <hr>
  <p><a href="registreUsuari.html">No tens compte? Registra't</a></p>

  <script>
    const API = 'http://localhost:8000';
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch(API + '/login/', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email:       document.getElementById('email').value,
            contrasenya: document.getElementById('contrasenya').value
          })
        });
        const data = await res.json();
        if (data.status === 'èxit') {
          // Guardar dades — compatibles amb dashboard.html i dashboardPacient.html
          localStorage.setItem('usuari',      JSON.stringify(data));
          localStorage.setItem('pacient_dni', data.dni);
          localStorage.setItem('pacient_nom', data.nom);

          // Redirigir segons el rol:
          // metge o overlapping (metge+pacient) → dashboard del metge
          // pacient pur → dashboard del pacient
          if (data.rols.includes('metge')) {
            window.location.href = 'dashboard.html';
          } else {
            window.location.href = 'dashboardPacient.html';
          }
        } else {
          document.getElementById('missatge').textContent = data.missatge;
        }
      } catch (err) {
        document.getElementById('missatge').textContent = 'Error de connexio amb el servidor.';
      }
    });
  </script>
</body>
</html>
