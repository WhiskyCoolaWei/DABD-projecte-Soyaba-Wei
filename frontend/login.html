<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>HealthLog – Login</title>
  <style>
    body {
      min-height: 100vh;
      max-width: none;
      margin: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(26,82,118,0.15);
      padding: 32px 38px;
    }
    .auth-header {
      margin: -32px -38px 26px;
      padding: 28px 38px;
      border-radius: 14px 14px 0 0;
      background: linear-gradient(135deg, var(--blau-dark), var(--blau));
      color: white;
    }
    .auth-header h2 { font-size: 27px; font-weight: 700; border: none; margin: 0; color: white; }
    .auth-header span { font-size: 13px; opacity: .85; }
    .auth-card h3 {
      font-size: 18px; font-weight: 600; color: var(--ink);
      text-transform: none; letter-spacing: normal; margin-bottom: 20px;
    }
    .auth-card label { font-size: 12px; margin: 16px 0 7px; }
    .auth-card input { font-size: 15px; padding: 12px 14px; max-width: 100%; }
    .auth-card button { font-size: 14px; padding: 13px 22px; margin-top: 18px; }
    .auth-card hr { margin: 26px 0; }
    .auth-card .switch { text-align: center; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <h2>HealthLog</h2>
      <span>Sistema de gestio medica</span>
    </div>
    <h3>Iniciar sessio</h3>
    <form id="loginForm" style="background:transparent;box-shadow:none;padding:0;margin:0">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="contrasenya">Contrasenya</label>
      <input type="password" id="contrasenya" required>

      <button type="submit" style="width:100%">Entrar</button>
    </form>
    <p id="missatge" class="msg err"></p>
    <hr>
    <p class="switch">No tens compte? <a href="registreUsuari.html">Registra't</a></p>
  </div>

  <script>
    const API = 'http://localhost:8000';
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch(API + '/login/', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email:       document.getElementById('email').value,
            contrasenya: document.getElementById('contrasenya').value
          })
        });
        const data = await res.json();
        if (data.status === 'èxit') {
          // Guardar dades — compatibles amb dashboard.html i dashboardPacient.html
          localStorage.setItem('usuari',      JSON.stringify(data));
          localStorage.setItem('pacient_dni', data.dni);
          localStorage.setItem('pacient_nom', data.nom);

          // Redirigir segons el rol:
          // metge o overlapping (metge+pacient) → dashboard del metge
          // pacient pur → dashboard del pacient
          if (data.rols.includes('metge')) {
            window.location.href = 'dashboard.html';
          } else {
            window.location.href = 'dashboardPacient.html';
          }
        } else {
          document.getElementById('missatge').textContent = data.missatge;
        }
      } catch (err) {
        document.getElementById('missatge').textContent = 'Error de connexio amb el servidor.';
      }
    });
  </script>
</body>
</html>
