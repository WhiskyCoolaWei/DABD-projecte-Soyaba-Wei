<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
    <title>Consulta de Metges</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; padding: 40px; }
        .search-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 450px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; }
        .search-group { display: flex; gap: 10px; margin-bottom: 25px; }
        input { flex: 1; padding: 12px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 15px; }
        input:focus { border-color: #3498db; outline: none; }
        button { padding: 12px 20px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        .result-box { display: none; background: #fafafa; border: 1px solid #e4e7ed; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .result-box p { margin: 10px 0; font-size: 15px; color: #555; border-bottom: 1px dashed #eee; padding-bottom: 8px; }
        .result-box strong { color: #2c3e50; float: right; }
    </style>
</head>
<body>

<div class="search-card">
    <h2>Consultar Fitxa del Metge</h2>
    
    <div class="search-group">
        <input type="text" id="input_dni" placeholder="Introdueix el DNI del metge">
        <button type="button" id="btnCerca">Cercar</button>
    </div>

    <div class="result-box" id="resultats">
        <p>DNI: <strong id="res_dni">-</strong></p>
        <p>Nom complet: <strong id="res_nom">-</strong></p>
        <p>Núm. Col·legiat: <strong id="res_collegiat">-</strong></p>
    </div>
</div>

<script>
document.getElementById('btnCerca').addEventListener('click', async () => {
    const dni = document.getElementById('input_dni').value.trim();
    const resultBox = document.getElementById('resultats');
    
    if (!dni) {
        alert("Si us plau, introdueix un DNI vàlid.");
        return;
    }

    try {
        const resposta = await fetch(`http://127.0.0.1:8000/metges/?dni=${dni}`);
        const dada = await resposta.json();

        if (resposta.status === 200) {
            document.getElementById('res_dni').textContent = dada.metge.dni;
            document.getElementById('res_nom').textContent = dada.metge.nom + " " + dada.metge.cognoms;
            document.getElementById('res_collegiat').textContent = dada.metge.num_collegiat;
            
            resultBox.style.display = 'block';
        } else {
            resultBox.style.display = 'none';
            alert("❌ Error: " + dada.missatge);
        }
    } catch (e) {
        alert("Error de connexió amb el servidor.");
    }
});
</script>

</body>
</html>
